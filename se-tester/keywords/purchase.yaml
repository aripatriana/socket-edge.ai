name: "purchase"
description: "0200 purchase transaction — verify approved RC=00"

parameters:
  TERMINAL_ID: "TERM0001"
  MERCHANT_ID: "MERCH000000001"
  AMOUNT:      "000000050000"

steps:
  - id: purchase
    name: "0200 Purchase"
    action: SEND
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "{{vars.AMOUNT}}"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "{{vars.TERMINAL_ID}}"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    latencySla:
      warn: 500
      fail: 3000
    assertions:
      - mti: "0210"
        severity: HARD
        message: "Response harus 0210"
      - field: DE39
        equals: "00"
        severity: HARD
        message: "Harus approved RC=00"
      - field: DE11
        equalsField: "{{steps.purchase.request.DE11}}"
        severity: HARD
        message: "STAN harus di-echo back"
      - field: DE37
        equalsField: "{{steps.purchase.request.DE37}}"
        severity: HARD
        message: "RRN harus di-echo back"
      - field: DE38
        notEmpty: true
        severity: SOFT
        message: "Auth ID harus ada"
