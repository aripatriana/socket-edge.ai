name: "TC_001_Purchase_Happy_Path"
description: "0200 purchase — mock issuer approves, verify correlation and DE39=00"
tags: [regression, financial, p1]
timeout: 10000

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 0
  connect:
    host: "127.0.0.1"
    port: 9999       # Socket Edge acquirer port — change to match your SE config
    timeoutMs: 5000

variables:
  TERMINAL_ID: "TERM0001"
  MERCHANT_ID: "MERCH000000001"

steps:
  - id: purchase
    name: "Purchase 0200 — happy path"
    action: SEND
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "{{amount(min=10000,max=99999)}}"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "{{vars.TERMINAL_ID}}"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"

    latencySla:
      warn: 500
      fail: 3000

    assertions:
      - mti: "0210"
        severity: HARD
        message: "Response MTI harus 0210"

      - field: DE39
        equals: "00"
        severity: HARD
        message: "Harus approved (RC=00)"

      - field: DE11
        equalsField: "{{steps.purchase.request.DE11}}"
        severity: HARD
        message: "STAN harus di-echo back"

      - field: DE37
        equalsField: "{{steps.purchase.request.DE37}}"
        severity: HARD
        message: "RRN harus di-echo back"

      - field: DE38
        notEmpty: true
        severity: SOFT
        message: "Auth ID harus ada jika approved"

teardown:
  disconnect: true
  stopServer: true
