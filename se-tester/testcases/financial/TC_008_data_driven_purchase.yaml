name: "TC_008_Data_Driven_Purchase"
description: "Purchase 0200 dijalankan 5x dengan data dari CSV — verify setiap RC sesuai expected"
tags: [regression, financial, data-driven, p2, standalone]
timeout: 10000

dataFile: "../../data/purchase_variations.csv"

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 0
  connect:
    host: "127.0.0.1"
    port: 9100
    timeoutMs: 5000

variables:
  # Default values — akan di-override oleh CSV row
  AMOUNT:      "000000010000"
  TERMINAL_ID: "TERM0001"
  MERCHANT_ID: "MERCH000000001"
  EXPECTED_RC: "00"

steps:
  - id: purchase
    name: "Purchase 0200"
    action: SEND
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "{{vars.AMOUNT}}"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "{{vars.TERMINAL_ID}}"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"

    latencySla:
      warn: 500
      fail: 3000

    assertions:
      - mti: "0210"
        severity: HARD
        message: "Response MTI harus 0210"

      - field: DE39
        equals: "{{vars.EXPECTED_RC}}"
        severity: HARD
        message: "RC harus sesuai expected dari CSV"

      - field: DE4
        equalsField: "{{steps.purchase.request.DE4}}"
        severity: HARD
        message: "Amount harus di-echo back"

      - field: DE11
        equalsField: "{{steps.purchase.request.DE11}}"
        severity: HARD
        message: "STAN harus di-echo back"

      - field: DE41
        equalsField: "{{steps.purchase.request.DE41}}"
        severity: HARD
        message: "Terminal ID harus di-echo back"

teardown:
  disconnect: true
  stopServer: true
