name: "TC_002_Cash_Advance"
description: "0200 cash advance (DE3=200000) — verify DE3 echo-back dan RC=00"
tags: [regression, financial, p1, standalone]
timeout: 10000

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 0
  connect:
    host: "127.0.0.1"
    port: 9100
    timeoutMs: 5000

variables:
  TERMINAL_ID: "TERM0002"
  MERCHANT_ID: "MERCH000000001"

steps:
  - id: cash_advance
    name: "Cash Advance 0200 — DE3=200000"
    action: SEND
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "200000"
        DE4:  "{{amount(min=50000,max=500000)}}"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "{{vars.TERMINAL_ID}}"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"

    latencySla:
      warn: 500
      fail: 3000

    assertions:
      - mti: "0210"
        severity: HARD
        message: "Response MTI harus 0210"

      - field: DE39
        equals: "00"
        severity: HARD
        message: "Harus approved (RC=00)"

      - field: DE3
        equals: "200000"
        severity: HARD
        message: "DE3 (processing code) harus di-echo back sebagai 200000"

      - field: DE11
        equalsField: "{{steps.cash_advance.request.DE11}}"
        severity: HARD
        message: "STAN harus di-echo back"

      - field: DE37
        equalsField: "{{steps.cash_advance.request.DE37}}"
        severity: HARD
        message: "RRN harus di-echo back"

      - field: DE4
        equalsField: "{{steps.cash_advance.request.DE4}}"
        severity: HARD
        message: "Amount harus di-echo back"

teardown:
  disconnect: true
  stopServer: true
