name: "TC_006_Decline"
description: "0200 purchase — mock issuer menolak dengan RC=05 (Do Not Honour), DE38 harus kosong"
tags: [regression, financial, decline, p1, standalone]
timeout: 10000

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 0
    responseCode: "05"     # Do Not Honour — mock akan return RC=05, tidak set DE38
  connect:
    host: "127.0.0.1"
    port: 9100
    timeoutMs: 5000

variables:
  TERMINAL_ID: "TERM0006"
  MERCHANT_ID: "MERCH000000001"

steps:
  - id: declined_purchase
    name: "Purchase 0200 — declined RC=05"
    action: SEND
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "{{amount(min=10000,max=99999)}}"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "{{vars.TERMINAL_ID}}"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"

    latencySla:
      warn: 500
      fail: 3000

    assertions:
      - mti: "0210"
        severity: HARD
        message: "Response MTI harus 0210"

      - field: DE39
        equals: "05"
        severity: HARD
        message: "Harus decline RC=05 (Do Not Honour)"

      - field: DE39
        notEquals: "00"
        severity: HARD
        message: "RC tidak boleh approved"

      - field: DE38
        exists: false
        severity: SOFT
        message: "Auth ID harus tidak ada pada transaksi yang di-decline"

      - field: DE11
        equalsField: "{{steps.declined_purchase.request.DE11}}"
        severity: HARD
        message: "STAN harus di-echo back"

      - field: DE37
        equalsField: "{{steps.declined_purchase.request.DE37}}"
        severity: HARD
        message: "RRN harus di-echo back"

teardown:
  disconnect: true
  stopServer: true
