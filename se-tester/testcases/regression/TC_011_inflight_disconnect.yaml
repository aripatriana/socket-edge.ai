name: "TC_011_Inflight_Disconnect"
description: |
  Simulasi in-flight disconnect:
  1. client1 fire SEND_ASYNC (tidak blocking) ke mock dengan delayMs 2s
  2. client1 langsung di-disconnect sebelum response tiba
  3. client2 tetap berjalan normal — tidak terpengaruh oleh disconnect client1
  4. Mock server akan menerima request dari client1 dan mencoba kirim response,
     tapi channel client1 sudah tutup (response hilang — expected behavior)
tags: [regression, multi-connection, inflight, disconnect, p1, standalone]
timeout: 10000

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 2000    # 2 detik delay — memberi waktu untuk disconnect sebelum response tiba
  connections:
    - id: client1
      host: "127.0.0.1"
      port: 9100
      timeoutMs: 5000
    - id: client2
      host: "127.0.0.1"
      port: 9100
      timeoutMs: 5000

variables:
  MERCHANT_ID: "MERCH000000001"

steps:
  - id: verify_client2_before
    name: "Baseline: client2 berjalan normal sebelum in-flight"
    action: SEND
    connection: client2
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "000000010000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "TRM_C2_B"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    latencySla:
      warn: 3000     # mock delay 2s, jadi warn threshold lebih longgar
      fail: 5000
    assertions:
      - mti: "0210"
        severity: HARD
        message: "Baseline client2 harus dapat response"
      - field: DE39
        equals: "00"
        severity: HARD

  - id: fire_inflight_client1
    name: "SEND_ASYNC dari client1 — in-flight, tidak tunggu response"
    action: SEND_ASYNC
    connection: client1
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "000000020000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "TRM_C1_F"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    # Tidak ada assertions — response diabaikan

  - id: disconnect_client1_while_inflight
    name: "Disconnect client1 saat response belum tiba (mock delay 2s)"
    action: DISCONNECT
    connection: client1

  - id: verify_client2_after_disconnect
    name: "client2 harus tetap jalan normal setelah client1 disconnect mid-flight"
    action: SEND
    connection: client2
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=5200)}}"
        DE3:  "000000"
        DE4:  "000000030000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "TRM_C2_C"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    latencySla:
      warn: 3000
      fail: 5000
    assertions:
      - mti: "0210"
        severity: HARD
        message: "client2 harus dapat response meski client1 disconnect mid-flight"
      - field: DE39
        equals: "00"
        severity: HARD
      - field: DE41
        equals: "TRM_C2_C"
        severity: HARD
        message: "Response client2 tidak boleh tercampur dengan request client1"

teardown:
  disconnect: true    # closes client2
  stopServer: true
