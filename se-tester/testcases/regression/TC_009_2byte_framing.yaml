name: "TC_009_2Byte_Framing"
description: "Verify ISO framing dengan 2-byte header (SE-Core compatible) — client dan mock server sama-sama pakai headerBytes: 2"
tags: [regression, protocol, framing, standalone]
timeout: 10000

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 0
    headerBytes: 2        # SE-Core compatible framing
  connect:
    host: "127.0.0.1"
    port: 9100
    timeoutMs: 5000
    headerBytes: 2        # harus match dengan server

variables:
  TERMINAL_ID: "TERM0009"
  MERCHANT_ID: "MERCH000000001"

steps:
  - id: purchase
    name: "Purchase 0200 via 2-byte framing"
    action: SEND
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "000000050000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "{{vars.TERMINAL_ID}}"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"

    latencySla:
      warn: 500
      fail: 3000

    assertions:
      - mti: "0210"
        severity: HARD
        message: "Response MTI harus 0210"

      - field: DE39
        equals: "00"
        severity: HARD
        message: "RC harus 00"

      - field: DE11
        equalsField: "{{steps.purchase.request.DE11}}"
        severity: HARD
        message: "STAN harus di-echo back"

teardown:
  disconnect: true
  stopServer: true
