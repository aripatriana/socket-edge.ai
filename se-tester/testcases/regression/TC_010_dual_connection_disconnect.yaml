name: "TC_010_Dual_Connection_Disconnect"
description: "Dua koneksi simultan ke mock, disconnect satu, verify koneksi lain masih berjalan normal"
tags: [regression, multi-connection, disconnect, p1, standalone]
timeout: 10000

setup:
  server:
    port: 9100
    autoRespond: true
    delayMs: 0
  connections:
    - id: client1
      host: "127.0.0.1"
      port: 9100
      timeoutMs: 5000
    - id: client2
      host: "127.0.0.1"
      port: 9100
      timeoutMs: 5000

variables:
  MERCHANT_ID: "MERCH000000001"

steps:
  - id: tx_client1_first
    name: "Transaksi via client1 (pertama)"
    action: SEND
    connection: client1
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=4111)}}"
        DE3:  "000000"
        DE4:  "000000010000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "TRM_C1_A"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    assertions:
      - mti: "0210"
        severity: HARD
        message: "client1 harus dapat response 0210"
      - field: DE39
        equals: "00"
        severity: HARD

  - id: tx_client2_while_both_up
    name: "Transaksi via client2 (saat keduanya aktif)"
    action: SEND
    connection: client2
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=5200)}}"
        DE3:  "000000"
        DE4:  "000000020000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "TRM_C2_A"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    assertions:
      - mti: "0210"
        severity: HARD
        message: "client2 harus dapat response 0210"
      - field: DE39
        equals: "00"
        severity: HARD

  - id: disconnect_client1
    name: "Putus koneksi client1"
    action: DISCONNECT
    connection: client1

  - id: tx_client2_after_disconnect
    name: "Transaksi via client2 setelah client1 putus — harus tetap jalan"
    action: SEND
    connection: client2
    message:
      mti: "0200"
      fields:
        DE2:  "{{pan(prefix=5200)}}"
        DE3:  "000000"
        DE4:  "000000030000"
        DE7:  "{{datetime()}}"
        DE11: "{{stan()}}"
        DE12: "{{time()}}"
        DE13: "{{date()}}"
        DE22: "051"
        DE25: "00"
        DE37: "{{rrn()}}"
        DE41: "TRM_C2_B"
        DE42: "{{vars.MERCHANT_ID}}"
        DE49: "360"
    assertions:
      - mti: "0210"
        severity: HARD
        message: "client2 harus tetap dapat response setelah client1 disconnect"
      - field: DE39
        equals: "00"
        severity: HARD
      - field: DE41
        equals: "TRM_C2_B"
        severity: HARD
        message: "Transaksi tidak boleh tercampur dengan client1"

teardown:
  disconnect: true    # closes client2 (client1 sudah disconnect di step)
  stopServer: true
