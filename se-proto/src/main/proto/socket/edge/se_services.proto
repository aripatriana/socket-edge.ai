syntax = "proto3";

package socket.edge;

import "socket/edge/se_common.proto";
import "socket/edge/se_os.proto";
import "socket/edge/se_jvm.proto";
import "socket/edge/se_channel.proto";
import "socket/edge/se_ai.proto";

option java_package        = "com.socket.edge.grpc";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────────
// CoreService — gRPC server hosted by se-core.
//
// Topology:
//   se-console  → client  (subscribe metrics, send control commands)
//   se-ai       → client  (subscribe metrics, push weight updates)
//   se-core     → server  (single gRPC server, central hub)
//
// RPC types used:
//   Unary           → request/response (control commands, static info)
//   Server streaming → se-core pushes data to connected subscribers
//
// Phase 1: OS metrics + control commands
// Phase 2: + JvmSnapshot   (se_jvm.proto)
// Phase 3: + ChannelSnapshot, WeightUpdate, AnomalyEvent (se_channel.proto, se_ai.proto)
// ─────────────────────────────────────────────────────────────

// Wraps all periodic snapshots into a single bundle per interval.
// Grows as new snapshot types are added in subsequent phases.
message MetricsBundle {
    OsSnapshot      os      = 1;
    JvmSnapshot     jvm     = 2;
    ChannelSnapshot channel = 3;
    string          node_id = 10;  // se-core cluster node identifier
}

// Engine health snapshot returned by GetHealth
message HealthResponse {
    string status = 1;  // "OK" (MASTER) or "STANDBY" (SLAVE)
    string role   = 2;  // "MASTER" or "SLAVE"
    string mode   = 3;  // "CLUSTER" or "STANDALONE"
}

// Request to target a named channel for control operations
message ChannelRequest {
    string channel_name = 1;
}

// Request to target a single socket by its binding id
message SocketRequest {
    string binding_id = 1;
}

service CoreService {

    // ── Static info ───────────────────────────────────────────
    // Fetch once on connect. Does not change at runtime.
    rpc GetSystemInfo(Empty) returns (SystemInfo);

    // ── Health ────────────────────────────────────────────────
    rpc GetHealth(Empty) returns (HealthResponse);


    // ── Metrics streaming ─────────────────────────────────────
    // se-console and se-ai subscribe here.
    // se-core pushes a MetricsBundle at every collection interval.
    // If se-core restarts, clients must reconnect and re-subscribe.
    rpc SubscribeMetrics(Empty) returns (stream MetricsBundle);


    // ── Control commands ──────────────────────────────────────
    // Called by se-console. Same semantics as the previous HTTP Admin API.
    // grpcurl equivalent: grpcurl -plaintext -d '{"channel_name":"bni"}' \
    //   host:9090 socket.edge.CoreService/StartChannel

    rpc StartChannel(ChannelRequest)   returns (ControlResponse);
    rpc StopChannel(ChannelRequest)    returns (ControlResponse);
    rpc RestartChannel(ChannelRequest) returns (ControlResponse);
    rpc ReloadConfig(Empty)            returns (ControlResponse);

    rpc StartSocket(SocketRequest)     returns (ControlResponse);
    rpc StopSocket(SocketRequest)      returns (ControlResponse);
    rpc RestartSocket(SocketRequest)   returns (ControlResponse);


    // ── Static config ─────────────────────────────────────────
    // Called by se-console on connect and after ReloadConfig.
    // Returns the live channel configuration from ChannelGroupRegistry.
    rpc GetChannelConfigs(Empty) returns (ChannelConfigList);


    // ── AI feedback ───────────────────────────────────────────
    // Called by se-ai after each LinUCB iteration.
    // Delivers adaptive weight adjustments back to se-core for
    // immediate application to the routing strategy.
    rpc UpdateWeight(WeightUpdate) returns (ControlResponse);

}