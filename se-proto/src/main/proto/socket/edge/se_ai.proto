syntax = "proto3";

package socket.edge;

option java_package        = "com.socket.edge.grpc";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────────
// SE-AI protocol messages — Phase 3
//
// se-ai computes adaptive weights per endpoint within a channel
// using the LinUCB bandit algorithm, then pushes updates here.
//
// se-core receives UpdateWeight and applies the distribution
// to its routing strategy immediately.
// ─────────────────────────────────────────────────────────────

// Weight assignment for a single endpoint (identified by hash_id).
message EndpointWeight {
    string hash_id = 1;   // matches SocketSnapshot.hash_id
    int32  weight  = 2;   // 0..100; DOWN endpoint always 0
}

// Weight update published by se-ai after every LinUCB iteration.
message WeightUpdate {
    string                  channel_name = 1;   // e.g. "fello", "bca"
    repeated EndpointWeight weights      = 2;   // one per CLIENT endpoint; sum ≈ 100
    double                  reward       = 3;   // last computed reward [-1.0 .. +1.0]
    double                  confidence   = 4;   // exploration term of the best endpoint
    int64                   timestamp    = 5;   // epoch millis when computed
}
